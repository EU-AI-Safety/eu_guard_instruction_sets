[project]
name = "eu-guard-cls"
version = "0.1.0"
description = "SFT / DPO for a multilingual EU AI Act guard classifier (EU-Guard)"
requires-python = ">=3.11,<3.13"
# Training stack pinned to the versions locked in eu-guard-dpo-main/uv.lock, so results are comparable.
# (trl 0.24 is NOT compatible with transformers 5: it treats every optional dependency as installed.)
dependencies = [
    "torch==2.15.0",
    "transformers==5.22.2",
    "trl==1.17.1",
    "peft==0.21.2",
    "datasets==5.1.0",
    "accelerate==1.15.0",
    "huggingface-hub==2.4.0",
    "pyyaml==6.0.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
track = ["wandb>=0.31.0"]
# vLLM pins its own torch; on the GPU box install it in a separate env (or use the vLLM container) for
# `eug_cls.predict --backend vllm`. eug_cls.predict only needs vllm + the eval files, not trl/peft.
eval = ["vllm"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eug_cls"]
